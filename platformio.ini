; LILYGO T-Dongle-S3 — Reconclave dual-role node + standalone firmware.
;
; It combines a physical-button-gated local payload library with the
; trust-governed Reconclave protocol surface. Network HID still requires an
; authenticated signed scope and currently fails closed until verification is
; implemented. See README.md for the safe MSC transfer-mode plan.
;
; Generic esp32-s3-devkitc-1 stand-in with flash/partitions overridden to the
; real 16MB, same as the standalone firmware and devices/cardputer-adv.
[platformio]
default_envs = t_dongle_s3

[env:t_dongle_s3]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags =
    --no-stub
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
build_unflags =
    -DARDUINO_USB_MODE=1
    -std=gnu++11
build_flags =
    -std=gnu++17
    ; USB-OTG (TinyUSB) mode for USBHIDKeyboard; Serial still works via CDC.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
    -DUSB_MANUFACTURER="\"Reconclave\""
    -DUSB_PRODUCT="\"Reconclave T-Dongle-S3 (node)\""
    -DCORE_DEBUG_LEVEL=1
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT
    -DST7735_DRIVER
    -DTFT_WIDTH=80
    -DTFT_HEIGHT=160
    -DST7735_GREENTAB160x80
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_MISO=-1
    -DTFT_MOSI=3
    -DTFT_SCLK=5
    -DTFT_CS=4
    -DTFT_DC=2
    -DTFT_RST=1
    -DLOAD_GLCD=1
    -DSPI_FREQUENCY=27000000
    -Wall
    -Wextra
    -Wformat=2
; Shared Reconclave protocol/domain library (common/protocol).
lib_extra_dirs =
    shared
lib_deps =
    fastled/FastLED@3.9.13
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.4.2
